name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build-test-package:
    name: Build, Test, Package
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Verify Local Package
        run: ./script/package_local.sh --verify

      - name: Upload Local Package
        uses: actions/upload-artifact@v4
        with:
          name: SSH-AutoTunnel-local
          path: dist/package/SSH-AutoTunnel-local.zip
          if-no-files-found: error
          retention-days: 14
