name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test-package:
    name: Build, Test, Package
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build
        run: swift build --force-resolved-versions

      - name: Test
        run: swift test

      - name: Verify Local Package
        run: ./script/package_local.sh --verify

      - name: Verify Signed Update Feed
        run: python3 script/test_appcast.py

      - name: Upload Local Package
        uses: actions/upload-artifact@v4
        with:
          name: SSH-AutoTunnel-local
          path: |
            dist/package/SSH-AutoTunnel-local.zip
            dist/package/SSH-AutoTunnel-local.zip.sha256
          if-no-files-found: error
          retention-days: 14
